apiVersion: apps/v1
kind: Deployment
metadata:
  name: bhuvanaweb
  labels:
    app: bhuvanaweb
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bhuvanaweb
  template:
    metadata:
      labels:
        app: bhuvanaweb
    spec:
      containers:
        - name: bhuvanaweb
          image: bhuvanaweb:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
