apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: buva-frontend
  namespace: buva
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - bhuva.duckdns.org
      secretName: bhuva-duckdns-tls
  rules:
    - host: bhuva.duckdns.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80

